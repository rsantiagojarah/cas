[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axis"
version = "1.0.0"
description = "Motor modular de diseño estructural"
requires-python = ">=3.9"
dependencies = [
    "tabulate>=0.9.0",
    "fpdf2>=2.7.0",
    "prompt_toolkit>=3.0.0",
    "comtypes>=1.2.0",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
]

[project.scripts]
cas = "axis.cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["axis*"]
