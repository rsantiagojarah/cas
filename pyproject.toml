[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axis"
version = "1.0.0"
description = "Motor modular de diseño estructural"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
axis = "axis.cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["axis*"]
